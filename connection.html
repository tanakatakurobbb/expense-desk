<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expense Desk｜GitHub接続</title><link rel="stylesheet" href="workspace.css"><script src="session.js" defer></script><script src="common.js" defer></script><script src="connection.js" defer></script></head><body class="summary-page"><main class="workspace-main"><div class="page-intro"><h1>GitHub接続</h1><p>接続の設定と状態を、ここで確認できます。</p></div><details class="surface collapsible-tools"><summary>GitHub接続状態 <span data-connection-summary>未接続</span></summary><div class="tools-body"><div id="connection-status" role="status" aria-live="polite"></div></div></details><section class="surface"><h2>接続設定</h2><label>接続先リポジトリ<input id="connection-repository" type="text" autocomplete="off" placeholder="owner/repository"></label><label>GitHubトークン<input id="connection-token" type="password" autocomplete="off" placeholder="Fine-grained token"></label><p class="subtle">開いているホームのメモリ内で保持します。画面を切り替えても再入力せずに使用できます。ホームを再読込すると再入力が必要です。再接続・接続解除時は、未保存の編集も含めて読込データをリセットします。</p><div class="connection-actions"><button id="connect">接続を確認する</button><button id="disconnect" class="secondary">接続解除</button></div><p id="connection-result" role="status" aria-live="polite" class="subtle"></p><details><summary>初回のトークン設定</summary><p class="subtle">対象は接続先リポジトリのみ、ContentsはRead and writeに設定してください。</p><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">GitHubのトークン作成画面</a></details></section></main></body></html>
